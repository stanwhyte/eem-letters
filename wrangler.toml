name = "eem-letters"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Lets the Worker import widget.html as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Custom domain. Cloudflare creates the DNS record and certificate itself.
routes = [
  { pattern = "letters.empowerethnicmedia.org", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "eem-letters"
database_id = "0bd9e52e-d75c-4afe-aabe-b3bfb2edbac9"

[vars]
PUBLIC_BASE      = "https://letters.empowerethnicmedia.org"
FROM_ADDR        = "letters@empowerethnicmedia.org"
FROM_NAME        = "Empower Ethnic Media"
CAMPAIGN_COPY    = "letters@empowerethnicmedia.org"
FRAME_ANCESTORS  = "https://empowerethnicmedia.org https://www.empowerethnicmedia.org"
TURNSTILE_SITEKEY = "0x4AAAAAAEjKZb3xQy48vDrz"

# Resend Audience for campaign updates. Contacts are added only after the
# reader clicks the confirmation link, so the list is double opt-in.
# Leave blank and consent is still recorded in D1, just not pushed to Resend.
RESEND_AUDIENCE_ID = ""

# Campaign recipients Represent does not supply.
# Leave blank to hide that option from the widget.
EMAIL_MINISTER = ""
EMAIL_PMO      = ""
EMAIL_HERITAGE = ""

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put RESEND_KEY
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put IP_PEPPER
#   npx wrangler secret put ANTHROPIC_KEY      (optional)
